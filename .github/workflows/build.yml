name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Dependabot auto-merges use GITHUB_TOKEN, which doesn't trigger push builds, so build main on a schedule too
    - cron: '0 12 * * 1'

jobs:
  build:
    uses: FoundatioFx/Foundatio/.github/workflows/build-workflow.yml@main
    secrets: inherit
    with:
      new-test-runner: true
